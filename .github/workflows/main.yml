name: Update Release Notes

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-notes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      APP: settings
      RELEASE_NOTES_DIR: release-notes/current
      RELEASE_NOTES_FILE: release_notes.json
      SUMMARY_API: https://mummified-reviving-preschool.ngrok-free.dev/api/release-notes/generate-summary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release notes file exists
        run: |
          mkdir -p "$RELEASE_NOTES_DIR"

          if [ ! -f "$RELEASE_NOTES_DIR/$RELEASE_NOTES_FILE" ]; then
            echo "[]" > "$RELEASE_NOTES_DIR/$RELEASE_NOTES_FILE"
          fi

      - name: Fetch PR files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            repos/${{ github.repository }}/pulls/$PR_NUMBER/files \
            > files.json

      - name: Generate AI summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          LABELS=$(echo "$PR_LABELS" | jq '[.[].name]')

          jq -n \
            --arg app "$APP" \
            --argjson number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg description "$PR_BODY" \
            --arg author "$PR_AUTHOR" \
            --arg mergedAt "$PR_MERGED_AT" \
            --argjson labels "$LABELS" \
            --slurpfile files files.json \
            '{
              app: $app,
              pr: {
                number: $number,
                title: $title,
                description: $description,
                author: $author,
                mergedAt: $mergedAt,
                labels: $labels
              },
              files: ($files[0] | map({
                path,
                patch
              }))
            }' > request.json

          if curl \
            --silent \
            --show-error \
            --fail \
            -X POST \
            "$SUMMARY_API" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            --data @request.json \
            > summary-response.json; then

            if jq -e '.summary' summary-response.json >/dev/null 2>&1; then
              jq '.summary' summary-response.json > summary.json
            else
              echo "[]" > summary.json
            fi

          else
            echo "AI summary generation failed. Continuing..."
            echo "[]" > summary.json
          fi

      - name: Create or update release note
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          FILE="$RELEASE_NOTES_DIR/$RELEASE_NOTES_FILE"

          LABELS=$(echo "$PR_LABELS" | jq '[.[].name]')
          SUMMARY=$(cat summary.json)

          jq \
            --arg app "$APP" \
            --argjson pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg author "$PR_AUTHOR" \
            --arg mergedAt "$PR_MERGED_AT" \
            --argjson labels "$LABELS" \
            --argjson summary "$SUMMARY" \
            '
            if any(.[]; .pr == $pr) then
              map(
                if .pr == $pr then
                  .app = $app
                  | .title = $title
                  | .description = $body
                  | .author = $author
                  | .mergedAt = $mergedAt
                  | .labels = $labels
                  | .summary = $summary
                else
                  .
                end
              )
            else
              . + [{
                app: $app,
                pr: $pr,
                title: $title,
                description: $body,
                author: $author,
                mergedAt: $mergedAt,
                labels: $labels,
                summary: $summary,
                published: false,
                release: null
              }]
            end
            ' "$FILE" > "$RELEASE_NOTES_DIR/tmp.json"

          mv "$RELEASE_NOTES_DIR/tmp.json" "$FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$RELEASE_NOTES_DIR/$RELEASE_NOTES_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(release-notes): update PR #${{ github.event.pull_request.number }}"
          git push
